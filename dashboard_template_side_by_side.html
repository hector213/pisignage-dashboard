
<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>Live Production Dashboard</title>
<style>
 body {
   background: #000;
   color: #00FF00;
   font-family: Arial, sans-serif;
   text-align: center;
   padding: 20px;
 }
 .row {
   display: flex;
   justify-content: space-around;
   align-items: center;
   margin: 100px 0;
 }
 .kpi {
   font-size: 140px;
   font-weight: bold;
   margin: 0;
   color: #00FF00;
 }
 .label {
   font-size: 80px;
   margin: 0;
   color: #FFFFFF;
 }
 .cell {
   display: flex;
   flex-direction: column;
   align-items: center;
   width: 45%;
 }
</style>
</head>
<body>

 <div class='row'>
   <div class='cell'>
     <div class='kpi'>2368</div>
     <div class='label'>GOAL</div>
   </div>
   <div class='cell'>
     <div class='kpi'>404</div>
     <div class='label'>PACKED</div>
   </div>
 </div>

 <div class='row'>
   <div class='cell'>
     <div class='kpi'>17%</div>
     <div class='label'>% COMPLETE</div>
   </div>
   <div class='cell'>
     <div class='kpi'>1964</div>
     <div class='label'>REMAINING</div>
   </div>
 </div>

</body>
</html>
